[project]
name = "reallymyradar"
version = "0.1.0"
description = "Local high-resolution NEXRAD Level II radar server"
requires-python = ">=3.12"
dependencies = [
    "arm-pyart>=2.3.0",
    "fastapi>=0.160.0",
    "httpx>=0.28.1",
    "ngrok>=1.7",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "pystray>=0.19.5",
    "scipy>=1.18.1",
    "segno>=1.6.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
reallymyradar = "reallymyradar.app:main"
radar = "reallymyradar.app:headless"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reallymyradar"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
